<style>
body {
background-color: #FFF8E7;
background-image: radial-gradient(rgba(255, 255, 255, 0.6) 2px, transparent 2px);
background-size: 30px 30px;
margin: 0;
min-height: 100vh;
overflow-x: hidden;
position: relative;
}
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.page-transition { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes popIn {
0% { opacity: 0; transform: scale(0.96) translateY(10px); }
100% { opacity: 1; transform: scale(1) translateY(0); }
}
.stagger-1 { animation: popIn 0.5s ease forwards; animation-delay: 0.1s; opacity: 0; }
.stagger-2 { animation: popIn 0.5s ease forwards; animation-delay: 0.15s; opacity: 0; }
.stagger-3 { animation: popIn 0.5s ease forwards; animation-delay: 0.2s; opacity: 0; }
.stagger-4 { animation: popIn 0.5s ease forwards; animation-delay: 0.25s; opacity: 0; }
@keyframes pulse-ring {
0% { box-shadow: 0 0 0 0 rgba(212, 28, 30, 0.5); }
100% { box-shadow: 0 0 0 12px rgba(212, 28, 30, 0); }
}
.animate-pulse-ring { animation: pulse-ring 2s infinite; }
.btn-press { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.btn-press:active { transform: scale(0.96) !important; box-shadow: 0 2px 4px rgba(19, 42, 83, 0.1) !important; }
.toast-enter { animation: slideDown 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
.toast-exit { animation: slideUp 0.3s ease-in forwards; }
@keyframes slideDown {
from { top: -100px; opacity: 0; }
to { top: 24px; opacity: 1; }
}
@keyframes slideUp {
from { top: 24px; opacity: 1; }
to { top: -100px; opacity: 0; }
}
@keyframes floatUpAndSway {
0% { transform: translateY(110vh) translateX(0) scale(0.6) rotate(0deg); opacity: 0; }
15% { opacity: 0.7; }
85% { opacity: 0.7; }
100% { transform: translateY(-15vh) translateX(40px) scale(1) rotate(45deg); opacity: 0; }
}
@keyframes floatUpAndSwayReverse {
0% { transform: translateY(110vh) translateX(0) scale(0.6) rotate(0deg); opacity: 0; }
15% { opacity: 0.7; }
85% { opacity: 0.7; }
100% { transform: translateY(-15vh) translateX(-40px) scale(1) rotate(-45deg); opacity: 0; }
}
.floating-star {
position: absolute;
bottom: -10%;
animation: floatUpAndSway linear infinite;
z-index: 0;
pointer-events: none;
}
.floating-star-rev {
position: absolute;
bottom: -10%;
animation: floatUpAndSwayReverse linear infinite;
z-index: 0;
pointer-events: none;
}
@keyframes orbMove1 {
0%, 100% { transform: translate(0, 0); }
50% { transform: translate(4vw, 8vh); }
}
@keyframes orbMove2 {
0%, 100% { transform: translate(0, 0); }
50% { transform: translate(-5vw, 10vh); }
}
.bg-orb {
position: absolute;
border-radius: 50%;
z-index: 0;
pointer-events: none;
opacity: 0.9;
}
